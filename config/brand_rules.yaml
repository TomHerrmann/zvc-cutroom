# Zero Vision Cinema brand rules.
# Validators read this file; prompts are generated from it. Change a rule here,
# not in a prompt string. Values marked DRAFT are starting points to confirm.

brand: Zero Vision Cinema
version: 1

cta:
  required: true
  max_start_seconds: 5.0        # CTA must begin within the first 5 seconds of the clip
  allowed_kinds: [spoken, overlay]

cover:
  require_face: true
  min_words: 3
  max_words: 5

quotes:
  # Seconds of slack allowed around a quote's claimed timestamp when looking it up.
  timestamp_tolerance_seconds: 1.0
  # Exact match after normalisation (case, punctuation, whitespace). No fuzzy matching:
  # a quote that is not in the transcript is an invented quote.
  match: exact_normalized

spoilers:
  # Terms that must never appear in caption, titles, hashtags, or cover text. DRAFT.
  banned_terms: []
  # Per-video additions live in the video's sidecar file (data/<video_id>/spoilers.yaml).

hashtags:
  required: ["#zerovisioncinema"]   # DRAFT
  max_count: 5
  pattern: "^#[A-Za-z0-9_]+$"

# Two output formats. Vertical is always short form, wide is always long form.
formats:
  vertical:
    platform: tiktok
    form: short
    width: 1080
    height: 1920
    captions: burned_in          # styled subtitle track burned into the picture
    min_seconds: 15              # DRAFT
    max_seconds: 60              # DRAFT
    caption_max_chars: 2200
    render:                      # DRAFT preset, used by the Resolve render step (milestone 3)
      codec: h264
      target_bitrate_mbps: 16
  wide:
    platform: youtube
    form: long
    width: 3840
    height: 2160
    captions: srt                # plain SRT with timestamps uploaded alongside the video
    min_seconds: 60              # DRAFT
    max_seconds: 14400
    caption_max_chars: 5000
    render:                      # DRAFT preset
      codec: h265
      target_bitrate_mbps: 45

# Subtitles come from DaVinci Resolve Studio's AI transcription, get an accuracy pass
# from Claude, and go back into Resolve on the subtitle track.
subtitles:
  source: resolve
  review_model: claude-opus-5-5
  # Colors are the Zero Vision Cinema site tokens (tailwind.config.ts).
  text_color: "#FFFDF6"          # Glow, the brand off-white
  highlight_color: "#4A8CC6"     # Blue Light
  highlight: active_word         # vertical only: the word being spoken is highlighted
  max_chars_per_line:            # DRAFT
    vertical: 22
    wide: 42
  caption_style:                 # vertical burned-in captions; DRAFT
    font: Montserrat ExtraBold
    size: 84
    uppercase: true
    max_words: 3
    outline: 7
    margin_x: 80
    margin_bottom: 560

# Vertical clips that come from a longer YouTube review end on the ZVC Topic Label Slam
# instead of a spoken "let me know what you think". The title comes straight from the ZVC
# folder of Resolve's title library (Fusion/Templates/ZVC Topic Label Slam.drfx).
end_card:
  title: ZVC Topic Label Slam
  topic_title: FULL VIDEO ON YOUTUBE
  label: ZERO VISION CINEMA
  seconds: 3.0
  transition_in: overlap        # on a track above the video, starting over its last frames
  overlap_frames: 12
  only_when_long_review: true
  replaces:
    - let me know what you think
    - let us know in the comments
    - do you think i'm way off base
